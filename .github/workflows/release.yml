name: Create GitHub Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release notes
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches mobile version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p 'require("./apps/mobile/package.json").version')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match nasti-mobile version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG_FILE="apps/mobile/CHANGELOG.md"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          if [[ -f "$CHANGELOG_FILE" ]] && grep -q "^## $VERSION\$" "$CHANGELOG_FILE"; then
            awk -v ver="## $VERSION" '
              $0 == ver { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$CHANGELOG_FILE" > "$NOTES_FILE"
            echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          if [[ -n "$NOTES_FILE" ]]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
